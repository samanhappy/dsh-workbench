# GitHub release-note categories.
#
# `gh release create --generate-notes` groups merged pull requests by the
# labels below (first matching category wins). Keep label names in sync with
# the labels used on pull requests; the final `*` bucket catches everything
# else so no change silently disappears from the notes.

changelog:
  exclude:
    labels:
      - skip-changelog
      - duplicate
      - invalid
      - question
      - wontfix
  categories:
    - title: Features
      labels:
        - feature
        - enhancement
    - title: Fixes
      labels:
        - bug
        - fix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: CI & tooling
      labels:
        - ci
        - build
        - dependencies
    - title: Integrations
      labels:
        - gitlab
        - github
        - dms
        - sls
        - pingcode
        - skills
    - title: Other changes
      labels:
        - '*'
