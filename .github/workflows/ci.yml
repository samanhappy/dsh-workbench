# Continuous integration for dsh-workbench.
#
# Every job runs on a fresh ubuntu-latest runner with only Node and npm — no
# glab / gh / aliyun / DSH install and no network beyond npm. `npm run smoke`
# deliberately never runs here: it drives the real, logged-in CLIs.
#
# The three checks are intentionally independent:
#   * test      — the committed test suites (Node 22.15.0 and 24.x). Node >=
#                 22.15 is required because the home-dashboard tests exercise
#                 node:zlib zstd; some suites chmod/symlink, so this is POSIX
#                 only and not Windows.
#   * artifacts — rebuild index.js / lib/client.js and fail on any drift. This
#                 cannot live inside `npm test`: `pretest` rebuilds first, so a
#                 stale committed artifact would be masked before it is diffed.
#   * typecheck — `tsc --noEmit` against the pinned public DSH contract
#                 packages installed by `npm run typecheck:setup`.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ['22.15.0', '24.x']
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `pretest` rebuilds the bundles, then `node --test` runs against the
      # built artifacts (the suites load lib/client.js, not the TS sources).
      - name: Run tests
        run: npm test

  artifacts:
    name: build artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Rebuild committed bundles
        run: npm run build

      - name: Committed bundles must not drift
        run: git diff --exit-code -- index.js lib/client.js

      - name: Build must not leave temporary files behind
        run: |
          if [ -e lib/_client.bundle.js ]; then
            echo "::error::build left the temporary bundle lib/_client.bundle.js behind"
            exit 1
          fi
          untracked="$(git ls-files --others --exclude-standard)"
          if [ -n "$untracked" ]; then
            echo "::error::build left untracked files in the working tree:"
            echo "$untracked"
            exit 1
          fi

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Installs the pinned public @deepseek-ai/* contract packages that
      # tsconfig.json type-only imports resolve against. Uses --no-save, so
      # package.json and package-lock.json stay untouched.
      - name: Install pinned DSH contract packages
        run: npm run typecheck:setup

      - name: Typecheck
        run: npm run typecheck
